name: Build and deploy ProfitSite

on:
  push:
    branches: [main, infra/ghcr-hosting]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy main to the VPS after both image checks pass"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: profitsite-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_deploy_scripts:
    name: Check deployment scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n deploy/deploy-profitsite.sh deploy/install-actions-key.sh
      - name: Check deployment and rollback scenarios
        run: sudo python3 deploy/tests/test_deploy.py

  build:
    name: Build and check ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            port: 8000
            path: /health
          - service: frontend
            port: 3000
            path: /
    env:
      IMAGE: ghcr.io/seredapavel/profitsite/${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}
      SERVICE: ${{ matrix.service }}
      PORT: ${{ matrix.port }}
      CHECK_PATH: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for checks
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=profitsite-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=profitsite-${{ matrix.service }}

      - name: Check container HTTP response
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name profitsite-smoke \
            -e HOSTNAME=0.0.0.0 \
            -p "127.0.0.1:${PORT}:${PORT}" \
            "${IMAGE}:${IMAGE_TAG}"

          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-all-errors \
            --connect-timeout 3 --max-time 10 \
            --output /tmp/profitsite-response \
            "http://127.0.0.1:${PORT}${CHECK_PATH}"

          if [ "$SERVICE" = backend ]; then
            python3 -c 'import json; assert json.load(open("/tmp/profitsite-response")).get("ok") is True'
          fi
          test "$(docker inspect --format '{{.State.Running}}' profitsite-smoke)" = true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish checked image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${IMAGE_TAG}"

      - name: Publish latest from main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:${IMAGE_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Container logs on failure
        if: failure()
        shell: bash
        run: docker logs --tail 100 profitsite-smoke 2>/dev/null || true

      - name: Clean up check container
        if: always()
        shell: bash
        run: docker rm -f profitsite-smoke 2>/dev/null || true

  deploy:
    name: Deploy ProfitSite
    needs: [build, check_deploy_scripts]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: profitsite-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.PROFITSITE_VPS_HOST }}
      DEPLOY_KEY: ${{ secrets.PROFITSITE_VPS_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PROFITSITE_VPS_KNOWN_HOSTS }}
    steps:
      - name: Deploy through the restricted SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          task_ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$task_ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$task_ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$task_ssh_dir/known_hosts"
          chmod 600 "$task_ssh_dir/key" "$task_ssh_dir/known_hosts"
          ssh -i "$task_ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$task_ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
