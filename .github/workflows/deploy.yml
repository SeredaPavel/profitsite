# /.github/workflows/deploy.yml
name: deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: profitsite-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_BASE: ghcr.io/seredapavel/profitsite
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH || '/opt/profitsite' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (runner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:latest
            ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:latest
            ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS (pull/up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          envs: VPS_PATH
          script: |
            set -e

            echo "VPS_PATH=$VPS_PATH"
            mkdir -p "$VPS_PATH"
            cd "$VPS_PATH"

            # Логин в GHCR на сервере (чтобы docker pull работал)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            cat > docker-compose.yml <<'EOF'
            version: "3.9"
            services:
              profitsite-backend:
                image: ghcr.io/seredapavel/profitsite/backend:latest
                container_name: profitsite-backend
                env_file:
                  - .env
                expose:
                  - "8000"
                networks:
                  - edge

              profitsite-frontend:
                image: ghcr.io/seredapavel/profitsite/frontend:latest
                container_name: profitsite-frontend
                environment:
                  - NEXT_PUBLIC_API_BASE=/api
                expose:
                  - "3000"
                depends_on:
                  - profitsite-backend
                networks:
                  - edge

            networks:
              edge:
                external: true
            EOF

            cat > .env <<'EOF'
            TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            TG_CHAT_ID=${{ secrets.TG_CHAT_ID }}
            EOF

            # Не ругаемся, если сеть уже есть
            docker network inspect edge >/dev/null 2>&1 || docker network create edge

            docker pull ghcr.io/seredapavel/profitsite/backend:latest
            docker pull ghcr.io/seredapavel/profitsite/frontend:latest

            docker compose up -d

            echo "---- ps ----"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
