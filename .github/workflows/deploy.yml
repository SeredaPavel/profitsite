# /.github/workflows/deploy.yml
name: deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: profitsite-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_BASE: ghcr.io/seredapavel/profitsite
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_PORT: ${{ secrets.VPS_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:latest
            ${{ env.IMAGE_BASE }}/backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:latest
            ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

      - name: Deploy on VPS (pull/up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            set -e
            mkdir -p "${VPS_PATH}"
            cd "${VPS_PATH}"

            cat > docker-compose.yml <<'EOF'
            version: "3.9"

            services:
              profitsite-backend:
                image: ghcr.io/seredapavel/profitsite/backend:latest
                container_name: profitsite-backend
                environment:
                  - SMTP_HOST=${SMTP_HOST}
                  - SMTP_PORT=${SMTP_PORT}
                  - SMTP_USER=${SMTP_USER}
                  - SMTP_PASS=${SMTP_PASS}
                  - SMTP_FROM=${SMTP_FROM}
                  - MAIL_TO=${MAIL_TO}
                  - SMTP_TLS=${SMTP_TLS}
                  - SMTP_STARTTLS=${SMTP_STARTTLS}
                expose:
                  - "8000"
                networks:
                  - edge

              profitsite-frontend:
                image: ghcr.io/seredapavel/profitsite/frontend:latest
                container_name: profitsite-frontend
                environment:
                  - NEXT_PUBLIC_API_BASE=/api
                expose:
                  - "3000"
                depends_on:
                  - profitsite-backend
                networks:
                  - edge

            networks:
              edge:
                external: true
            EOF

            cat > .env <<'EOF'
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            MAIL_TO=${{ secrets.MAIL_TO }}
            SMTP_TLS=${{ secrets.SMTP_TLS }}
            SMTP_STARTTLS=${{ secrets.SMTP_STARTTLS }}
            EOF

            docker network create edge || true

            docker pull ghcr.io/seredapavel/profitsite/backend:latest
            docker pull ghcr.io/seredapavel/profitsite/frontend:latest

            docker compose up -d

            echo "---- ps ----"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "---- health ----"
            curl -sS http://localhost/ -I | head || true
